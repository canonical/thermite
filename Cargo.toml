[package]
name = "thermite"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "thermite"
path = "src/bin/thermite.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
